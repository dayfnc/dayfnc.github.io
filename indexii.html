<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>My Tasks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, sans-serif;
      background: #f2f2f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      background: white;
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      padding: 60px 20px 16px;
      background: white;
      border-bottom: 1px solid #e5e5ea;
    }
    .header h1 { font-size: 28px; font-weight: 700; color: #1c1c1e; }
    .header p  { font-size: 14px; color: #8e8e93; margin-top: 2px; }

    /* ── Add section ── */
    .add-section {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e5ea;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row { display: flex; gap: 8px; }

    input[type="text"] {
      flex: 1;
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #d1d1d6;
      background: #f2f2f7;
      color: #1c1c1e;
      outline: none;
    }
    input[type="text"]:focus { border-color: #007aff; }

    input[type="datetime-local"] {
      width: 100%;
      font-size: 15px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #d1d1d6;
      background: #f2f2f7;
      color: #1c1c1e;
      outline: none;
    }

    .add-btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: #007aff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .add-btn:active { background: #0062cc; }

    .status-msg {
      font-size: 13px;
      color: #34c759;
      min-height: 18px;
      text-align: center;
    }

    /* ── Task list ── */
    .task-list {
      flex: 1;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: #8e8e93;
      font-size: 15px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: #f2f2f7;
      border-radius: 12px;
    }

    .task-item.done { opacity: 0.45; }
    .task-item.done .task-name { text-decoration: line-through; }

    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #c7c7cc;
      flex-shrink: 0;
      cursor: pointer;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      background: transparent;
    }
    .task-check.checked { background: #34c759; border-color: #34c759; }

    .task-info { flex: 1; }
    .task-name { font-size: 16px; color: #1c1c1e; line-height: 1.4; }
    .task-time { font-size: 13px; color: #8e8e93; margin-top: 2px; }

    .task-delete {
      font-size: 20px;
      color: #c7c7cc;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0 2px;
      line-height: 1;
    }
    .task-delete:active { color: #ff3b30; }

    /* ── Notifications bar ── */
    .notif-bar {
      padding: 12px 16px 30px;
      text-align: center;
      border-top: 1px solid #e5e5ea;
    }
    .notif-bar p { font-size: 13px; color: #8e8e93; }
    .notif-btn {
      margin-top: 6px;
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid #d1d1d6;
      background: white;
      color: #007aff;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app">

  <div class="header">
    <h1>My Tasks</h1>
    <p id="date-label"></p>
  </div>

  <div class="add-section">
    <div class="input-row">
      <input type="text" id="task-input" placeholder="Add a task..." />
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>
    <input type="datetime-local" id="time-input" />
    <div class="status-msg" id="status-msg"></div>
  </div>

  <div class="task-list" id="task-list">
    <div class="empty-state" id="empty-state">No tasks yet. Add one above!</div>
  </div>

  <div class="notif-bar">
    <p id="notif-status">Enable reminders so tasks can notify you</p>
    <button class="notif-btn" onclick="requestNotifs()">Enable reminders</button>
  </div>

</div>

<script>
  // ── Load saved tasks from device storage ──
  let tasks = JSON.parse(localStorage.getItem('my-tasks') || '[]');

  // ── Show today's date in the header ──
  const d = new Date();
  document.getElementById('date-label').textContent =
    d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

  // ── Save tasks to device storage ──
  function save() {
    localStorage.setItem('my-tasks', JSON.stringify(tasks));
  }

  // ── Show a quick status message ──
  function showStatus(msg, isError) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.style.color = isError ? '#ff3b30' : '#34c759';
    setTimeout(() => el.textContent = '', 2500);
  }

  // ── Render the task list to the screen ──
  function render() {
    const list = document.getElementById('task-list');
    const empty = document.getElementById('empty-state');

    if (tasks.length === 0) {
      list.innerHTML = '';
      list.appendChild(empty);
      return;
    }

    list.innerHTML = tasks.map((task, i) => `
      <div class="task-item ${task.done ? 'done' : ''}">
        <div class="task-check ${task.done ? 'checked' : ''}" onclick="toggleDone(${i})">
          ${task.done ? '✓' : ''}
        </div>
        <div class="task-info">
          <div class="task-name">${task.name}</div>
          ${task.time ? `<div class="task-time">${formatTime(task.time)}</div>` : ''}
        </div>
        <button class="task-delete" onclick="deleteTask(${i})">×</button>
      </div>
    `).join('');
  }

  // ── Format a date string nicely ──
  function formatTime(iso) {
    return new Date(iso).toLocaleString('en-US', {
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  }

  // ── Add a new task ──
  function addTask() {
    const nameEl = document.getElementById('task-input');
    const timeEl = document.getElementById('time-input');
    const name = nameEl.value.trim();

    if (!name) {
      showStatus('Please enter a task name.', true);
      return;
    }

    const task = { name, time: timeEl.value || null, done: false };
    tasks.unshift(task); // add to top of list
    save();
    render();

    if (task.time) scheduleNotif(task);

    nameEl.value = '';
    timeEl.value = '';
    showStatus('Task added!');
  }

  // ── Mark a task as done / not done ──
  function toggleDone(i) {
    tasks[i].done = !tasks[i].done;
    save();
    render();
  }

  // ── Delete a task ──
  function deleteTask(i) {
    tasks.splice(i, 1);
    save();
    render();
  }

  // ── Ask for notification permission ──
  async function requestNotifs() {
    if (!('Notification' in window)) {
      document.getElementById('notif-status').textContent =
        'Notifications not supported in this browser.';
      return;
    }
    const result = await Notification.requestPermission();
    document.getElementById('notif-status').textContent =
      result === 'granted'
        ? 'Reminders enabled!'
        : 'Permission denied — check your browser settings.';
  }

  // ── Schedule a browser notification at the task's time ──
  function scheduleNotif(task) {
    if (Notification.permission !== 'granted' || !task.time) return;
    const delay = new Date(task.time) - Date.now();
    if (delay > 0) {
      setTimeout(() => {
        new Notification('Task reminder', { body: task.name });
      }, delay);
    }
  }

  // ── Initial render ──
  render();
</script>

</body>
</html>
